name: portfolio_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.1
  animated_text_kit: ^4.2.2
  firebase_core: ^3.6.0
  flutter_svg: ^2.0.10+1
  firebase_analytics: ^11.3.4
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/logos/

  fonts:
    - family: Custom
      fonts:
        - asset: assets/Northwood_High.ttf
